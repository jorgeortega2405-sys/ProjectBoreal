services:
  mysql:
    image: mysql:8.0
    container_name: boreal-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./database/db_lottery.sql:/docker-entrypoint-initdb.d/01-db_lottery.sql:ro
      - mysql_data:/var/lib/mysql
    mem_limit: 1536m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: boreal-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:4.1
    container_name: boreal-cassandra
    restart: unless-stopped
    ports:
      - "127.0.0.1:9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: boreal_cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - ./database/db_cassandra.cql:/docker-entrypoint-initdb.d/db_cassandra.cql:ro
      - cassandra_data:/var/lib/cassandra
    entrypoint:
      - sh
      - -c
      - |
        (
          until cqlsh -e 'describe cluster' > /dev/null 2>&1; do sleep 3; done
          echo 'Aplicando esquema CQL de auditoria en Cassandra...'
          cqlsh -f /docker-entrypoint-initdb.d/db_cassandra.cql
          echo 'Esquema CQL aplicado exitosamente.'
        ) &
        exec /usr/local/bin/docker-entrypoint.sh cassandra -f
    mem_limit: 2048m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  websocket:
    build:
      context: ./websocket
      dockerfile: Dockerfile
    container_name: boreal-websocket
    restart: unless-stopped
    ports:
      - "127.0.0.1:3008:3008"
    environment:
      PORT: 3008
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3008; echo -e \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"healthy\" <&3' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  payment-worker:
    build:
      context: ./payment_worker
      dockerfile: Dockerfile
    container_name: boreal-payment-worker
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_LOTTERY_NAME:-db_lottery}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      STORAGE_RECEIPTS_DIR: /app/storage/receipts
      LOG_DIR: /app/logs/worker
    volumes:
      - ./payment_worker:/app
      - ./storage/receipts:/app/storage/receipts
      - ./logs/worker:/app/logs/worker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1024m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import redis, os, sys; r = redis.Redis(host='redis', port=6379, password=os.getenv('REDIS_PASSWORD')); sys.exit(0 if r.exists('boreal:worker:heartbeat') else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boreal-app
    restart: unless-stopped
    profiles: ["full", "app"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_LOTTERY_NAME: ${DB_LOTTERY_NAME:-db_lottery}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: boreal_audit
      WEBSOCKET_HOST: websocket
      WEBSOCKET_PORT: 3008
    volumes:
      - ./storage/receipts:/app/storage/receipts
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1024m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health | grep -q '\"status\":\"healthy\"\\|\"status\":\"degraded\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: boreal-admin
    restart: unless-stopped
    profiles: ["full", "admin"]
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_LOTTERY_NAME: ${DB_LOTTERY_NAME:-db_lottery}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./admin/logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3001/api/health | grep -q '\"status\":\"healthy\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mysql_data:
  redis_data:
  cassandra_data:
