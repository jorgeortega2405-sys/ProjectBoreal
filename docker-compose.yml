services:
  mysql:
    image: mysql:8.0
    container_name: boreal-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-sprite_password}
      MYSQL_USER: ${DB_USER:-sprite_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sprite_password}
    volumes:
      - ./database/db_identity.sql:/docker-entrypoint-initdb.d/01-db_identity.sql:ro
      - ./database/db_lottery.sql:/docker-entrypoint-initdb.d/02-db_lottery.sql:ro
      - mysql_data:/var/lib/mysql
    mem_limit: 1536m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: boreal-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-boreal_redis_auth_key_2026!}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-boreal_redis_auth_key_2026!}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-boreal_redis_auth_key_2026!}\" ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:4.1
    container_name: boreal-cassandra
    restart: unless-stopped
    ports:
      - "127.0.0.1:9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: boreal_cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - ./database/db_cassandra.cql:/docker-entrypoint-initdb.d/db_cassandra.cql:ro
      - cassandra_data:/var/lib/cassandra
    entrypoint:
      - sh
      - -c
      - |
        (
          until cqlsh -e 'describe cluster' > /dev/null 2>&1; do sleep 3; done
          echo 'Aplicando esquema CQL de auditoria en Cassandra...'
          cqlsh -f /docker-entrypoint-initdb.d/db_cassandra.cql
          echo 'Esquema CQL aplicado exitosamente.'
        ) &
        exec /usr/local/bin/docker-entrypoint.sh cassandra -f
    mem_limit: 2048m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  websocket:
    build:
      context: ./websocket
      dockerfile: Dockerfile
    container_name: boreal-websocket
    restart: unless-stopped
    ports:
      - "127.0.0.1:3008:3008"
    environment:
      PORT: 3008
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-boreal_redis_auth_key_2026!}
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  payment-worker:
    build:
      context: ./payment_worker
      dockerfile: Dockerfile
    container_name: boreal-payment-worker
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_LOTTERY_NAME:-db_lottery}
      DB_USER: ${DB_USER:-sprite_user}
      DB_PASSWORD: ${DB_PASSWORD:-sprite_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-boreal_redis_auth_key_2026!}
      STORAGE_RECEIPTS_DIR: /app/storage/receipts
      LOG_DIR: /app/logs/worker
    volumes:
      - ./payment_worker:/app
      - ./storage/receipts:/app/storage/receipts
      - ./logs/worker:/app/logs/worker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  mysql_data:
  redis_data:
  cassandra_data:
