services:
  mysql:
    image: mysql:8.0
    container_name: boreal-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: sprite_password
      MYSQL_USER: sprite_user
      MYSQL_PASSWORD: sprite_password
    volumes:
      - ./database/db_identity.sql:/docker-entrypoint-initdb.d/01-db_identity.sql:ro
      - ./database/db_lottery.sql:/docker-entrypoint-initdb.d/02-db_lottery.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sprite_user", "-psprite_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: boreal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:4.1
    container_name: boreal-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: boreal_cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  cassandra-init:
    image: cassandra:4.1
    container_name: boreal-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./database/db_cassandra.cql:/db_cassandra.cql:ro
    command: ["sh", "-c", "echo 'Cargando esquema CQL en Cassandra...' && cqlsh cassandra 9042 -f /db_cassandra.cql && echo 'Esquema de auditoria aplicado con exito.'"]
    restart: "no"

volumes:
  mysql_data:
  redis_data:
  cassandra_data:
