# ==============================================================================
# Configuración Nginx de Alto Rendimiento para ProjectBoreal (50,000+ Concurrentes)
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;
pid /var/run/nginx.pid;

events {
    worker_connections 50000;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Registro de accesos con buffers para no saturar disco en picos de 50k
    access_log /var/log/nginx/boreal_access.log combined buffer=64k flush=5s;
    error_log /var/log/nginx/boreal_error.log warn;

    # Optimizaciones del Kernel para I/O y transferencia de archivos
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Gestión de conexiones Keep-Alive
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 15;
    send_timeout 15;

    # Tamaños de buffers
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Compresión Gzip para reducir uso de ancho de banda hasta un 70%
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream Node.js (Servidor Web & API)
    upstream boreal_node {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 256;
    }

    # Upstream WebSocket en Rust (Maneja 50k-100k conexiones directas sin sobrecargar Node.js)
    upstream boreal_websocket_rust {
        server 127.0.0.1:3005 max_fails=3 fail_timeout=10s;
        keepalive 1024;
    }

    server {
        listen 80;
        server_name boreal.local;

        # Desviar todo el tráfico WebSocket `/ws` DIRECTAMENTE al microservicio Rust
        location /ws {
            proxy_pass http://boreal_websocket_rust;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts prolongados para mantener conexiones WebSocket vivas
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Archivos estáticos con caché agresivo (descargan 1 sola vez en el cliente)
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
            proxy_pass http://boreal_node;
            proxy_set_header Host $host;
            proxy_cache_valid 200 304 7d;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            access_log off;
        }

        # Todas las peticiones HTTP y API se dirigen al cluster de Node.js
        location / {
            proxy_pass http://boreal_node;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
