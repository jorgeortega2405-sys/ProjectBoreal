# ==============================================================================
# Ajustes del Kernel Linux para Servidor de Alto Rendimiento (50,000+ Sockets TCP)
# Aplicar en el host con: sudo sysctl -p /etc/sysctl.d/99-boreal.conf
# ==============================================================================

# Máximo número total de descriptores de archivos que el sistema puede abrir
fs.file-max = 2097152

# Tamaño de la cola de conexiones pendientes (backlog TCP)
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# Rango de puertos efímeros locales para conexiones salientes (evita agotamiento de puertos)
net.ipv4.ip_local_port_range = 1024 65535

# Reutilización rápida de sockets en estado TIME_WAIT
net.ipv4.tcp_tw_reuse = 1

# Reducción del tiempo de cierre de conexiones en estado FIN_WAIT_2 (libera descriptores rápido)
net.ipv4.tcp_fin_timeout = 15

# Ajuste de keepalive para detectar sockets caídos y liberar memoria
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5

# Ajuste de tamaño de buffers TCP para permitir 50,000 sockets sin exceder RAM disponible
# Formato: min default max (en bytes)
net.ipv4.tcp_rmem = 4096 87380 4194304
net.ipv4.tcp_wmem = 4096 65536 4194304

# Aumento del backlog de paquetes de red recibidos por la tarjeta de red
net.core.netdev_max_backlog = 65535
