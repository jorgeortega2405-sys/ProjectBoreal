<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/css/root.css">
  <link rel="stylesheet" href="/css/components/component-layout.css">
  <link rel="stylesheet" href="/css/components/component-buttons.css">

  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('boreal_admin_theme') || localStorage.getItem('boreal_theme') || 'system';
        if (savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (_) {}
    })();
  </script>
  <script type="module" src="/client/app-main.ts"></script>
</head>
<body>
  <div class="page-wrapper" data-ref="page-root">
    <div class="general-content" data-ref="app">
    </div>
  </div>
</body>
