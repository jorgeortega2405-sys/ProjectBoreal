<div class="component-wrapper component-wrapper--full view-wrapper" data-ref="admin-customers-view">
  <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="customers-scrollable">
    <div class="view-header" data-ref="customers-floating-top">
      <div class="view-header__left" data-ref="customers-floating-left">
        <h1 class="view-header__title" data-ref="customers-title">Directorio de Clientes y Participantes</h1>
      </div>

      <div class="view-header__right" data-ref="customers-floating-right">
        <div class="view-header__actions" data-ref="customers-default-actions">
          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-toggle-search" data-tooltip="Buscar participantes" aria-label="Buscar participantes">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          </button>

          <div class="component-inline-control component-inline-control--fixed component-inline-control--pagination" data-ref="pagination-inline-control">
            <div class="component-inline-control__group" data-ref="inline-group-page-prev">
              <button type="button" class="component-inline-control__btn" data-ref="btn-pagination-prev" data-tooltip="Página anterior" aria-label="Página anterior" disabled>
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#chevron_left"></use></svg>
              </button>
            </div>
            <input class="component-inline-control__input" data-ref="input-pagination-page" type="number" min="1" max="1" value="1" autocomplete="off" />
            <div class="component-inline-control__group" data-ref="inline-group-page-next">
              <button type="button" class="component-inline-control__btn" data-ref="btn-pagination-next" data-tooltip="Página siguiente" aria-label="Página siguiente" disabled>
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#chevron_right"></use></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="view-header__actions view-header__actions--selected is-hidden" data-ref="customers-selected-actions">
          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-deselect" data-tooltip="Cancelar selección" aria-label="Cancelar selección">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-dossier" data-tooltip="Ver Expediente de Compras" aria-label="Ver Expediente de Compras">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#visibility"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-toggle-block" data-tooltip="Bloquear / Desbloquear" aria-label="Bloquear / Desbloquear">
            <svg class="component-icon" data-ref="icon-toggle-block" aria-hidden="true"><use href="/icons.svg#block"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn btn-action-whatsapp-icon" data-ref="btn-action-whatsapp" data-tooltip="WhatsApp Directo" aria-label="WhatsApp Directo">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#smartphone"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-copy-phone" data-tooltip="Copiar Teléfono" aria-label="Copiar Teléfono">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#content_copy"></use></svg>
          </button>
        </div>
      </div>

      <div class="component-search-toolbar is-hidden" data-ref="search-toolbar">
        <div class="component-search component-search--full" data-ref="search-box">
          <div class="component-search__icon" data-ref="search-icon">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          </div>
          <div class="component-search__input-box" data-ref="search-input-box">
            <input class="component-search__input" data-ref="input-search-customers" placeholder="Buscar por teléfono, nombre o estado..." type="text" maxlength="100" autocomplete="off" />
          </div>
          <button type="button" class="component-button component-button--h34 component-button--icon-only is-hidden" data-ref="btn-clear-search" aria-label="Limpiar búsqueda">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="view-body admin-view-body admin-view-body--flush" data-ref="customers-content-container">
      <div class="customers-content-area" data-ref="customers-content-area">
        <section class="canvas-section canvas-section--full" data-ref="customers-section">
          <div class="winners-daily-wrapper" data-ref="customers-table-wrapper">
            <div class="winners-daily-table-card winners-daily-table-card--flush is-hidden" data-ref="customers-table-card">
              <div class="winners-daily-table-scroll">
                <table class="winners-daily-table" data-ref="customers-table">
                  <thead>
                    <tr>
                      <th class="winners-th" scope="col">Participante</th>
                      <th class="winners-th" scope="col">Teléfono</th>
                      <th class="winners-th" scope="col">Ubicación</th>
                      <th class="winners-th" scope="col">Boletos</th>
                      <th class="winners-th" scope="col">Pagadas</th>
                      <th class="winners-th" scope="col">Total Invertido</th>
                      <th class="winners-th" scope="col">Estado</th>
                      <th class="winners-th" scope="col">Última Actividad</th>
                    </tr>
                  </thead>
                  <tbody class="winners-tbody" data-ref="tbody-customers"></tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
