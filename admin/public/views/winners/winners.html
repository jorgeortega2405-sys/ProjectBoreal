<div class="component-wrapper component-wrapper--full view-wrapper" data-ref="admin-winners-view">
  <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="winners-scrollable">
    <div class="view-header" data-ref="winners-floating-top">
      <div class="view-header__left" data-ref="winners-floating-left">
        <h1 class="view-header__title" data-ref="winners-title">Gestión de Ganadores y Entrega de Premios</h1>
      </div>

      <div class="view-header__right" data-ref="winners-floating-right">
        <div class="view-header__actions" data-ref="winners-default-actions">
          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-toggle-search" data-tooltip="Buscar ganadores" aria-label="Buscar ganadores">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          </button>

          <div class="component-inline-control component-inline-control--fixed component-inline-control--pagination" data-ref="pagination-inline-control">
            <div class="component-inline-control__group" data-ref="inline-group-page-prev">
              <button type="button" class="component-inline-control__btn" data-ref="btn-pagination-prev" data-tooltip="Página anterior" aria-label="Página anterior" disabled>
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#chevron_left"></use></svg>
              </button>
            </div>
            <input class="component-inline-control__input" data-ref="input-pagination-page" type="number" min="1" max="1" value="1" autocomplete="off" />
            <div class="component-inline-control__group" data-ref="inline-group-page-next">
              <button type="button" class="component-inline-control__btn" data-ref="btn-pagination-next" data-tooltip="Página siguiente" aria-label="Página siguiente" disabled>
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#chevron_right"></use></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="view-header__actions view-header__actions--selected is-hidden" data-ref="winners-selected-actions">
          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-deselect" data-tooltip="Cancelar selección" aria-label="Cancelar selección">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-manage-delivery" data-tooltip="Gestionar Entrega de Premio" aria-label="Gestionar Entrega de Premio">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#edit"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-inspect-evidence" data-tooltip="Ver Evidencia / Comprobante" aria-label="Ver Evidencia / Comprobante">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#receipt_long"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn btn-action-whatsapp-icon" data-ref="btn-action-whatsapp" data-tooltip="WhatsApp Directo" aria-label="WhatsApp Directo">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#smartphone"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-copy-phone" data-tooltip="Copiar Teléfono" aria-label="Copiar Teléfono">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#content_copy"></use></svg>
          </button>
        </div>
      </div>

      <div class="component-search-toolbar is-hidden" data-ref="search-toolbar">
        <div class="component-search component-search--full" data-ref="search-box">
          <div class="component-search__icon" data-ref="search-icon">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          </div>
          <div class="component-search__input-box" data-ref="search-input-box">
            <input class="component-search__input" data-ref="input-search-winners" placeholder="Buscar por ganador, sorteo o teléfono..." type="text" maxlength="100" autocomplete="off" />
          </div>
          <button type="button" class="component-button component-button--h34 component-button--icon-only is-hidden" data-ref="btn-clear-search" aria-label="Limpiar búsqueda">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="view-body admin-view-body admin-view-body--flush" data-ref="winners-content-container">
      <div class="winners-content-area" data-ref="winners-content-area">
        <section class="canvas-section canvas-section--full" data-ref="winners-section">
          <div class="winners-daily-wrapper" data-ref="winners-table-wrapper">
            <div class="winners-daily-table-card winners-daily-table-card--flush is-hidden" data-ref="winners-table-card">
              <div class="winners-daily-table-scroll">
                <table class="winners-daily-table" data-ref="winners-table">
                  <thead>
                    <tr>
                      <th class="winners-th" scope="col">Sorteo</th>
                      <th class="winners-th" scope="col">Ganador</th>
                      <th class="winners-th" scope="col">Boleto Ganador</th>
                      <th class="winners-th" scope="col">Premio / Bolsa</th>
                      <th class="winners-th" scope="col">Teléfono / Ubicación</th>
                      <th class="winners-th" scope="col">Estado de Entrega</th>
                      <th class="winners-th" scope="col">Fecha Sorteo</th>
                    </tr>
                  </thead>
                  <tbody class="winners-tbody" data-ref="tbody-winners"></tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
