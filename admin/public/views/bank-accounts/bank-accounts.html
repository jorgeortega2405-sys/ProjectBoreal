<div class="component-wrapper component-wrapper--full view-wrapper" data-ref="admin-bank-accounts-view">
  <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="bank-accounts-scrollable">
    <div class="view-header" data-ref="bank-accounts-floating-top">
      <div class="view-header__left" data-ref="bank-accounts-floating-left">
        <h1 class="view-header__title" data-ref="bank-accounts-title">Cuentas Bancarias y Pasarelas</h1>
      </div>

      <div class="view-header__right" data-ref="bank-accounts-floating-right">
        <div class="view-header__actions" data-ref="bank-accounts-default-actions">
          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-toggle-search" data-tooltip="Buscar cuentas" aria-label="Buscar cuentas">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--black component-button--pill view-header__btn" data-ref="btn-create-account" data-tooltip="Registrar Cuenta" aria-label="Registrar Cuenta">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#add"></use></svg>
            <span>Nueva Cuenta</span>
          </button>
        </div>

        <div class="view-header__actions view-header__actions--selected is-hidden" data-ref="bank-accounts-selected-actions">
          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-deselect" data-tooltip="Cancelar selección" aria-label="Cancelar selección">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-edit" data-tooltip="Editar cuenta" aria-label="Editar cuenta">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#edit"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-toggle-status" data-tooltip="Pausar / Activar cuenta" aria-label="Pausar / Activar cuenta">
            <svg class="component-icon" data-ref="icon-action-toggle-status" aria-hidden="true"><use href="/icons.svg#pause"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-manage-giveaways" data-tooltip="Gestionar cobertura de sorteos" aria-label="Gestionar cobertura de sorteos">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#tune"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-copy-clabe" data-tooltip="Copiar CLABE" aria-label="Copiar CLABE">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#content_copy"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-action-copy-card" data-tooltip="Copiar número de tarjeta" aria-label="Copiar número de tarjeta">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#credit_card"></use></svg>
          </button>

          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn btn-action-danger-icon" data-ref="btn-action-delete" data-tooltip="Eliminar cuenta" aria-label="Eliminar cuenta">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#delete"></use></svg>
          </button>
        </div>
      </div>

      <div class="component-search-toolbar is-hidden" data-ref="search-toolbar">
        <div class="component-search component-search--full" data-ref="search-box">
          <div class="component-search__icon" data-ref="search-icon">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          </div>
          <div class="component-search__input-box" data-ref="search-input-box">
            <input class="component-search__input" data-ref="input-search-accounts" placeholder="Buscar por banco, titular, CLABE o tarjeta..." type="text" maxlength="100" autocomplete="off" />
          </div>
          <button type="button" class="component-button component-button--h34 component-button--icon-only is-hidden" data-ref="btn-clear-search" aria-label="Limpiar búsqueda">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="view-body admin-view-body" data-ref="bank-accounts-content-container">
      <div class="dashboard-stats-grid" data-ref="bank-accounts-stats-grid">
        <div class="dashboard-stat-card" data-ref="card-stat-active">
          <span class="dashboard-stat-card__title">Cuentas Activas</span>
          <div class="stat-card-value" data-ref="kpi-active-count">0</div>
          <span class="dashboard-stat-card__desc">Disponibles para checkout SPEI</span>
        </div>

        <div class="dashboard-stat-card" data-ref="card-stat-inactive">
          <span class="dashboard-stat-card__title">Cuentas Pausadas</span>
          <div class="stat-card-value" data-ref="kpi-inactive-count">0</div>
          <span class="dashboard-stat-card__desc">Ocultas de nuevas compras</span>
        </div>

        <div class="dashboard-stat-card" data-ref="card-stat-banks">
          <span class="dashboard-stat-card__title">Bancos Conectados</span>
          <div class="stat-card-value" data-ref="kpi-banks-count">0</div>
          <span class="dashboard-stat-card__desc">Instituciones receptoras</span>
        </div>

        <div class="dashboard-stat-card" data-ref="card-stat-coverage">
          <span class="dashboard-stat-card__title">Sorteos con Cobertura</span>
          <div class="stat-card-value" data-ref="kpi-coverage-count">0</div>
          <span class="dashboard-stat-card__desc">Con al menos 1 cuenta activa</span>
        </div>
      </div>

      <div class="bank-accounts-content-area" data-ref="bank-accounts-content-area">
        <div class="canvas-grid bank-accounts-canvas-grid" data-ref="bank-accounts-grid-container"></div>
      </div>
    </div>
  </div>
</div>
