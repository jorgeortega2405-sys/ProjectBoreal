<div class="component-wrapper component-wrapper--full home-wrapper view-wrapper" data-ref="giveaway-form-wrapper">
  <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="giveaway-form-scrollable">
    <div class="view-body" data-ref="giveaway-form-container" style="max-width: 1100px; margin: 0 auto; padding: 24px;">
      <div class="view-backdrop" data-ref="giveaway-form-gradient-backdrop"></div>

      <div class="view-header" data-ref="form-header" style="margin-bottom: 24px; border-bottom: none;">
        <div class="view-header__left" data-ref="form-header-left">
          <button type="button" class="component-button component-button--h40 component-button--icon-only view-header__btn" data-ref="btn-back" data-tooltip="Volver a sorteos" aria-label="Volver a sorteos">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#arrow_back"></use></svg>
          </button>
          <h1 class="view-header__title" data-ref="form-title">
            <span class="view-header__title-name">Crear Sorteo</span>
          </h1>
        </div>

        <div class="view-header__right" data-ref="form-header-right">
          <div class="view-header__actions" data-ref="form-actions">
            <button type="button" class="component-button component-button--h40 component-button--black" data-ref="btn-save-giveaway">
              Guardar Sorteo
            </button>
          </div>
        </div>
      </div>

      <form class="giveaway-edit-form" data-ref="giveaway-form" style="position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start;">
        <div class="form-column form-column--media" style="display: flex; flex-direction: column; gap: 16px;">
          <label class="field" data-ref="field-primary-image">
            <input class="field__input" data-ref="input-primary-image" type="url" placeholder=" " required />
            <span class="field__label">URL de foto principal</span>
          </label>

          <div class="form-image-preview" data-ref="primary-image-preview" style="width: 100%; aspect-ratio: 16 / 10; max-height: 260px; border-radius: 16px; overflow: hidden; background: var(--bg-surface-elevated); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
            <img class="form-preview-img" data-ref="primary-preview-img" src="" alt="Previsualización principal" style="width: 100%; height: 100%; object-fit: cover; display: none;" />
            <span class="form-preview-placeholder" data-ref="primary-preview-placeholder" style="color: var(--text-tertiary); font-size: 13px;">Vista previa de imagen principal</span>
          </div>

          <div class="form-secondary-section" style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px;">
            <span class="form-section-title" style="font-size: 14px; font-weight: 600; color: var(--text-primary);">Fotos Secundarias</span>
            
            <div class="form-secondary-input-row" style="display: flex; gap: 8px; align-items: center;">
              <label class="field" data-ref="field-secondary-image" style="flex: 1;">
                <input class="field__input" data-ref="input-secondary-image" type="url" placeholder=" " />
                <span class="field__label">URL de foto secundaria</span>
              </label>
              <button type="button" class="component-button component-button--h55" data-ref="btn-add-secondary-image">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#add"></use></svg>
                <span>Agregar</span>
              </button>
            </div>

            <div class="secondary-images-list" data-ref="secondary-images-list" style="display: flex; flex-wrap: wrap; gap: 10px;"></div>
          </div>
        </div>

        <div class="form-column form-column--details" style="display: flex; flex-direction: column; gap: 16px;">
          <label class="field" data-ref="field-title">
            <input class="field__input" data-ref="input-title" type="text" maxlength="255" placeholder=" " required />
            <span class="field__label">Título del sorteo</span>
          </label>

          <label class="field field--textarea" data-ref="field-description">
            <textarea class="field__textarea" data-ref="input-description" rows="4" placeholder=" "></textarea>
            <span class="field__label">Descripción detallada</span>
          </label>

          <div class="form-row-triplet" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
            <label class="field" data-ref="field-total-tickets">
              <input class="field__input" data-ref="input-total-tickets" type="number" min="1" step="1" placeholder=" " required />
              <span class="field__label">Total boletos</span>
            </label>

            <label class="field" data-ref="field-ticket-price">
              <input class="field__input" data-ref="input-ticket-price" type="number" min="0.01" step="0.01" placeholder=" " required />
              <span class="field__label">Precio boleto</span>
            </label>

            <label class="field" data-ref="field-currency">
              <select class="field__input component-select" data-ref="input-currency">
                <option value="USD">USD</option>
                <option value="MXN">MXN</option>
              </select>
              <span class="field__label">Moneda</span>
            </label>
          </div>

          <div class="form-row-pair" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <label class="field" data-ref="field-start-date">
              <input class="field__input" data-ref="input-start-date" type="datetime-local" placeholder=" " required />
              <span class="field__label">Fecha de inicio</span>
            </label>

            <label class="field" data-ref="field-end-date">
              <input class="field__input" data-ref="input-end-date" type="datetime-local" placeholder=" " required />
              <span class="field__label">Fecha de finalización</span>
            </label>
          </div>

          <div class="form-row-triplet" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
            <label class="field" data-ref="field-threshold-pct">
              <input class="field__input" data-ref="input-threshold-pct" type="number" min="0" max="100" value="0" placeholder=" " />
              <span class="field__label">Umbral mínimo (%)</span>
            </label>

            <label class="field" data-ref="field-countdown-hours">
              <input class="field__input" data-ref="input-countdown-hours" type="number" min="1" value="48" placeholder=" " />
              <span class="field__label">Horas conteo</span>
            </label>

            <label class="field" data-ref="field-status">
              <select class="field__input component-select" data-ref="input-status">
                <option value="active">Activo</option>
                <option value="draft">Borrador</option>
                <option value="paused">Pausado</option>
                <option value="completed">Finalizado</option>
              </select>
              <span class="field__label">Estado</span>
            </label>
          </div>

          <div class="form-actions-bottom" style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px;">
            <button type="button" class="component-button component-button--h44" data-ref="btn-cancel">
              Cancelar
            </button>
            <button type="button" class="component-button component-button--h44 component-button--black" data-ref="btn-save-bottom">
              Guardar Sorteo
            </button>
          </div>

          <div class="banner banner--danger" data-ref="form-error" style="display: none; margin-top: 8px;"></div>
        </div>
      </form>
    </div>
  </div>
</div>
