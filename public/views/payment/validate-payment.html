<div class="component-wrapper component-wrapper--full view-wrapper" data-ref="validate-payment-wrapper">
  <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="validate-payment-scrollable">
    <div class="view-body" data-ref="validate-payment-body">
      <div class="view-backdrop" data-ref="validate-payment-backdrop"></div>

      <div class="giveaway-detail-container" data-ref="validate-container" style="max-width: 960px;">
        <div class="view-hero" data-ref="validate-hero" style="padding: 24px 0 16px 0;">
          <div class="view-hero__content">
            <h1 class="view-hero__title" data-ref="validate-title" data-i18n="validate_payment.title"></h1>
            <p class="card__subtitle" data-ref="validate-subtitle" data-i18n="validate_payment.subtitle" style="text-align: center; max-width: 640px; margin: 0 auto;"></p>
          </div>
        </div>

        <!-- Barra de búsqueda por teléfono -->
        <div class="view-search-pill" data-ref="validate-search-box" style="margin-top: 16px;">
          <svg class="component-icon view-search-pill__icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          <input class="view-search-pill__input" data-ref="input-phone-search" data-i18n-placeholder="validate_payment.search_placeholder" data-i18n-aria="validate_payment.search_placeholder" type="tel" maxlength="20" placeholder=" " autocomplete="tel" />
          <button type="button" class="component-button component-button--h44 component-button--icon-only component-button--black" data-ref="btn-search-orders" data-i18n-tooltip="validate_payment.search_btn" data-i18n-aria="validate_payment.search_btn" data-tooltip="Buscar boletos" aria-label="Buscar boletos" style="border-radius: var(--sl-border-radius-pill); flex-shrink: 0;">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          </button>
        </div>

        <!-- Lista de Órdenes -->
        <div class="orders-list" data-ref="orders-list-container" style="display: flex; flex-direction: column; gap: 16px; margin-top: 12px;"></div>

        <!-- Estado Vacío -->
        <div class="empty-state" data-ref="orders-empty-state" style="display: none; text-align: center; padding: 60px 20px;">
          <svg class="component-icon" aria-hidden="true" style="width: 48px; height: 48px; color: var(--text-tertiary); margin-bottom: 12px;"><use href="/icons.svg#credit_card"></use></svg>
          <p class="empty-state__text" data-i18n="validate_payment.no_orders_found" style="color: var(--text-secondary); font-size: 15px;"></p>
        </div>
      </div>
    </div>
  </div>
</div>
