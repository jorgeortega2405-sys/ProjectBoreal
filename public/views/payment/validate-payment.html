<div class="component-wrapper component-wrapper--full view-wrapper" data-ref="validate-payment-wrapper">
  <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="validate-payment-scrollable">
    <div class="view-body" data-ref="validate-payment-body">
      <div class="view-backdrop" data-ref="validate-payment-backdrop"></div>

      <div class="giveaway-detail-container giveaway-detail-container--validate" data-ref="validate-container">
        <div class="view-hero" data-ref="validate-hero">
          <div class="view-hero__content">
            <h1 class="view-hero__title" data-ref="validate-title" data-i18n="validate_payment.title"></h1>
            <p class="card__subtitle view-hero__subtitle" data-ref="validate-subtitle" data-i18n="validate_payment.subtitle"></p>
          </div>
        </div>

        <!-- Barra de búsqueda por teléfono -->
        <div class="view-search-pill" data-ref="validate-search-box">
          <svg class="component-icon view-search-pill__icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          <input class="view-search-pill__input" data-ref="input-phone-search" data-i18n-placeholder="validate_payment.search_placeholder" data-i18n-aria="validate_payment.search_placeholder" type="tel" maxlength="20" placeholder=" " autocomplete="tel" />
          <button type="button" class="component-button component-button--h44 component-button--icon-only component-button--black" data-ref="btn-search-orders" data-i18n-tooltip="validate_payment.search_btn" data-i18n-aria="validate_payment.search_btn" data-tooltip="Buscar boletos" aria-label="Buscar boletos">
            <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          </button>
        </div>

        <!-- Lista de Órdenes -->
        <div class="orders-list" data-ref="orders-list-container"></div>

        <!-- Estado Vacío -->
        <div class="empty-state is-hidden" data-ref="orders-empty-state">
          <svg class="component-icon empty-state__icon" aria-hidden="true"><use href="/icons.svg#credit_card"></use></svg>
          <p class="empty-state__text" data-i18n="validate_payment.no_orders_found"></p>
        </div>
      </div>
    </div>
  </div>
</div>
