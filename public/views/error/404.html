<div class="component-wrapper component-wrapper--full view-wrapper" data-ref="not-found-wrapper">

    <div class="view-body view-body--not-found" data-ref="not-found-container">

        <span class="not-found-code" data-ref="not-found-code">404</span>

          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#arrow_back"></use></svg>
