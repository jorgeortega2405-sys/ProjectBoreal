<div class="component-wrapper component-wrapper--full view-wrapper" data-ref="legal-wrapper">
  <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="legal-scrollable">
    <div class="settings-layout" data-ref="legal-layout">

      <div class="legal-nav-bar" data-ref="legal-nav-bar" style="margin-bottom: 8px;">
        <button type="button" class="component-button component-button--secondary component-button--h36" data-ref="btn-back-help">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#arrow_back"></use></svg>
          <span data-ref="text-back-help" data-i18n="legal.back_to_help">Volver al Centro de Ayuda</span>
        </button>
      </div>

      <div class="settings-header" data-ref="legal-header">
        <div class="legal-icon-badge" data-ref="legal-badge" style="width: 48px; height: 48px; border-radius: 14px; background-color: var(--accent-pink-subtle); color: var(--accent-pink); display: flex; align-items: center; justify-content: center; margin-bottom: 8px;">
          <svg class="component-icon" aria-hidden="true" style="font-size: 24px;"><use href="/icons.svg#description"></use></svg>
        </div>
        <h1 class="settings-title" data-ref="legal-title" data-i18n="legal.terms_title">Términos y Condiciones de Uso</h1>
        <p class="settings-subtitle" data-ref="legal-subtitle" data-i18n="legal.terms_desc">Normas que rigen el acceso, uso de la plataforma y participación en los sorteos.</p>
        <span class="legal-effective-date" data-ref="legal-date" data-i18n="legal.effective_date" style="font-size: 11px; color: var(--text-tertiary); margin-top: 4px;">Vigente a partir de: Octubre 2026</span>
      </div>

      <div class="settings-group" data-ref="legal-content-group" style="padding: 32px 24px;">
        <div class="drawer-empty-card" data-ref="legal-placeholder-card">
          <div class="drawer-empty-state__icon" data-ref="placeholder-icon">
            <svg class="component-icon" aria-hidden="true" style="font-size: 32px;"><use href="/icons.svg#article"></use></svg>
          </div>
          <span class="drawer-empty-card__title" data-ref="placeholder-title" data-i18n="legal.terms_title">Términos y Condiciones de Uso</span>
          <p class="drawer-empty-card__desc" data-ref="placeholder-desc" data-i18n="legal.placeholder_notice">Este documento legal se encuentra en proceso de redacción y formalización normativa conforme al marco legal aplicable.</p>
        </div>
      </div>

    </div>
  </div>
</div>
