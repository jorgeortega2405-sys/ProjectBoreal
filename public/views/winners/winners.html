<div class="component-wrapper component-wrapper--full view-wrapper" data-ref="winners-wrapper">
  <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="winners-scrollable">
    <div class="view-body" data-ref="winners-container">
      <div class="view-backdrop" data-ref="winners-backdrop"></div>

      <div class="view-hero" data-ref="winners-hero">
        <div class="view-hero__content">
          <h1 class="view-hero__title" data-ref="winners-title" data-i18n="winners.hero_title">Ganadores y Entregas Oficiales</h1>

          <div class="view-search-pill" data-ref="winners-search-box">
            <svg class="component-icon view-search-pill__icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
            <input class="view-search-pill__input" data-ref="winners-search-input" type="text" placeholder=" " autocomplete="off" data-i18n-placeholder="winners.search_placeholder" data-i18n-aria="winners.search_aria" />
            <button type="button" class="component-button component-button--h32 component-button--icon-only view-search-pill__clear is-hidden" data-ref="btn-clear-search" data-i18n-tooltip="winners.clear_search" data-i18n-aria="winners.clear_search">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
            </button>
          </div>

          <div class="component-tags-carousel-wrapper view-tags-wrapper" data-ref="winners-tabs">
            <div class="component-tags-carousel">
              <button type="button" class="component-badge component-badge--interactive is-active" data-ref="tab-standard" data-tab="standard">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#stars"></use></svg>
                <span>Sorteos Principales</span>
              </button>
              <button type="button" class="component-badge component-badge--interactive" data-ref="tab-daily" data-tab="daily">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#bolt"></use></svg>
                <span>Sorteos Diarios</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <section class="canvas-section" data-ref="winners-section">
        <div class="winners-loading" data-ref="winners-loading">
          <div class="loading-spinner"></div>
          <span class="winners-loading__text" data-i18n="app.loading">Cargando...</span>
        </div>

        <!-- Grid de Sorteos Estándar -->
        <div class="canvas-grid" data-ref="winners-grid"></div>

        <!-- Tabla de Ganadores Diarios -->
        <div class="winners-daily-wrapper is-hidden" data-ref="winners-daily-wrapper">
          <div class="winners-daily-table-card">
            <div class="winners-daily-table-scroll">
              <table class="winners-daily-table" data-ref="winners-daily-table">
                <thead>
                  <tr>
                    <th class="winners-th winners-th--winner" scope="col">Ganador</th>
                    <th class="winners-th winners-th--location" scope="col">Ubicación</th>
                    <th class="winners-th winners-th--phone" scope="col">Teléfono</th>
                    <th class="winners-th winners-th--ticket" scope="col">Boleto</th>
                    <th class="winners-th winners-th--prize" scope="col">Premio Ganado</th>
                    <th class="winners-th winners-th--date" scope="col">Fecha</th>
                  </tr>
                </thead>
                <tbody class="winners-tbody" data-ref="tbody-daily-winners"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
